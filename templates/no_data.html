<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Data - WFO Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #0a0a0f;
            min-height: 100vh;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fluid-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(ellipse at 30% 30%, rgba(99, 102, 241, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 70%, rgba(245, 158, 11, 0.08) 0%, transparent 50%);
        }

        .container {
            text-align: center;
            padding: 2rem;
        }

        .icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        p {
            color: rgba(255,255,255,0.6);
            margin-bottom: 0.5rem;
            max-width: 400px;
        }

        .hint {
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            background: rgba(255,255,255,0.05);
            padding: 1rem;
            border-radius: 12px;
            margin-top: 2rem;
            border: 1px solid rgba(255,255,255,0.1);
        }

        code {
            color: #6366f1;
        }
    </style>
</head>
<body>
    <div class="fluid-bg"></div>
    <div class="container">
        <div class="icon">&#128202;</div>
        <h1>No Data Found</h1>
        <p>No Excel file found in the data folder. Please upload your attendance tracking file.</p>
        <div class="hint">
            Expected location: <code>data/*.xlsx</code><br>
            Pattern: <code>App_Admin_UV-WCS*.xlsx</code>
        </div>
    </div>
</body>
</html>
